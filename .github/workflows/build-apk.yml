name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Build Web Assets
        run: |
          npm ci
          npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate and Build TWA Android APK
        run: |
          mkdir -p twa-build
          cd twa-build
          npx @bubblewrap/cli init --manifest https://ppokae.vercel.app/manifest.json --skipPwaValidation
          # Generate signing key if needed
          keytool -genkey -v -keystore android.keystore -alias ppokae -keyalg RSA -keysize 2048 -validity 10000 -storepass ppokaepassword -keypass ppokaepassword -dname "CN=PPOKAE, OU=Dev, O=Ppokae, L=Seoul, S=Seoul, C=KR"
          npx @bubblewrap/cli build --skipSigning || true
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppokae-apk
          path: '**/*.apk'
          if-no-files-found: warn
