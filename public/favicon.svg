<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring / Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Central Icon: Planet & Star Core -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="16" transform="rotate(-25 256 256)"/>
  <circle cx="256" cy="256" r="90" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Lightning Sparkle -->
  <path d="M260 120 L220 250 L270 250 L230 380 L320 230 L270 230 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Text Label -->
  <text x="256" y="450" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PPOKAE</text>
</svg>
